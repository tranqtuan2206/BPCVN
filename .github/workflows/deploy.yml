name: Build and Deploy BPCVN

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --no-restore --configuration Release

      - name: Publish Project
        run: dotnet publish -c Release -o ./publish

      # BƯỚC 1: Tạo và up file ẩn web để giải phóng file bị khóa
      - name: Turn off App (App Offline)
        run: |
          echo "<h1>He thong dang cap nhat, vui long quay lai sau...</h1>" > app_offline.htm
          curl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm -T app_offline.htm
          sleep 5

      # BƯỚC 2: Đẩy code mới lên
      - name: FTP Deploy to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          exclude: |
            **/appsettings.json
            **/appsettings.Production.json

      # BƯỚC 3: Xóa file ẩn để kích hoạt web chạy lại bình thường
      - name: Turn on App (Remove App Offline)
        if: always() # Luôn chạy bước này kể cả bước trên fail
        run: |
          curl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" ftp://${{ secrets.FTP_SERVER }}/ -Q "DELE /wwwroot/app_offline.htm"
