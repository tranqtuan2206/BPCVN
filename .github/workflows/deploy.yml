name: Build and Deploy BPCVN

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --no-restore --configuration Release

      - name: Publish Project
        # Chỉ định file project cụ thể để tránh cảnh báo NETSDK1194.
        run: dotnet publish BPCVN.csproj -c Release -o ./publish

      # BƯỚC 1: Tạo và tải lên file ẩn web để giải phóng file bị khóa
      - name: Turn off App (App Offline)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "<h1>He thong dang cap nhat, vui long quay lai sau...</h1>" > app_offline.htm
          curl --ssl -k --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/site1/app_offline.htm" -T app_offline.htm
          sleep 5

      # BƯỚC 2: Đẩy mã nguồn mới lên SmarterASP
      - name: FTP Deploy to SmarterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /site1/
          exclude: |
            **/appsettings.json
            **/appsettings.Production.json

      # BƯỚC 3: Xóa file ẩn để kích hoạt website chạy lại bình thường
      - name: Turn on App (Remove App Offline)
        if: always() # Luôn chạy bước này kể cả bước trên thất bại
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --ssl -k --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" -Q "DELE /site1/app_offline.htm"
