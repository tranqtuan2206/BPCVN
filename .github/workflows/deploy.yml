name: Build and Deploy BPCVN

on:
  push:
    # Chỉ kích hoạt workflow khi có code được đẩy trực tiếp lên nhánh main
    branches:
      - main
    # Chỉ chạy CI/CD khi thay đổi code nguồn, solution hoặc cấu hình workflow (bỏ qua docs, README, tools phụ trợ)
    paths:
      - "src/**"
      - "BPCVN.sln"
      - ".github/workflows/deploy.yml"

jobs:
  build-and-deploy:
    # Lớp bảo vệ bổ sung đảm bảo job chỉ thực thi khi push vào đúng nhánh main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Restore dependencies
        run: dotnet restore src/BPCVN.Web/BPCVN.Web.csproj

      - name: Build Project
        run: dotnet build src/BPCVN.Web/BPCVN.Web.csproj --no-restore --configuration Release

      - name: Publish Project
        # Chỉ định file project cụ thể để tránh cảnh báo NETSDK1194.
        run: dotnet publish src/BPCVN.Web/BPCVN.Web.csproj -c Release -r win-x64 --self-contained false -o ./publish

      # BƯỚC 1: Tạo và tải lên file ẩn web để giải phóng file bị khóa
      - name: Turn off App (App Offline)
        continue-on-error: true # Cho phép chạy tiếp để kiểm tra bước FTP Deploy
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "<h1>He thong dang cap nhat, vui long quay lai sau...</h1>" > app_offline.htm
          curl -v --ssl-reqd -k --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/site1/app_offline.htm" -T app_offline.htm || true
          sleep 5

      # BƯỚC 2: Đẩy mã nguồn mới lên SmarterASP
      - name: FTP Deploy to SmarterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: site1/
          # Không ghi đè cấu hình môi trường và dữ liệu người dùng tải lên trên server
          exclude: |
            **/appsettings.json
            **/appsettings.Production.json
            **/appsettings.Development.json
            **/wwwroot/uploads/**
            **/wwwroot/temp/**

      # BƯỚC 3: Xóa file ẩn để kích hoạt website chạy lại bình thường
      - name: Turn on App (Remove App Offline)
        if: always() # Luôn chạy bước này kể cả các bước trước thất bại
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -v --ssl-reqd -k --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" -Q "DELE /site1/app_offline.htm" || true
